<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>

    $(document).on('click', '#pokemon_search.btn', function() {

      const id = Math.floor(Math.random() * (151 - 1 + 1)) + 1;

      $.ajax({
        url: `https://pokeapi.co/api/v2/pokemon/${id}`,
        method: 'GET'

      }).done(function(res) {

        function encounter() {

          $.ajax({
            url: `${res.species.url}`,
            method: 'GET'

          }).done(function(rs) {
            console.log(rs.names[0].name);
            const encounterHtml =
            `
              <p class="name">${rs.names[0].name}</p>
              <div>
                <img class="img" src="${res.sprites.front_default}" alt="${rs.name}">
              </div>
              <div>
                <button class="btn" id="catch">捕まえる</button>
                <button class="btn" data-js="reset">逃げる</button>
              </div>
            `
            $('.wrapper').html(encounterHtml);

          }).fail(function(er) {
            console.log(
            `
              ${console.log(er)}
              日本語なまえの取得に失敗しました。
            `
            )
          })

        }

        function fiftyFifty() {
          const isGet = Math.round(Math.random());
          isGet === 1 ? success() : failure();
        }

        //ボール画像これでいいのか？？？？
        function success() {
          const doneHtml =
          `
            <p class="name">ゲットしました</p>
            <div>
              <img class="img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="">
            </div>
            <button class="btn" data-js="reset">戻る</button>
          `
          $('.wrapper').html(doneHtml);
        }

        function failure() {
          const failHtml =
          `
            <p class="text">逃げられてしまった...</p>
            <button class="btn mt" data-js="reset">戻る</button>
          `
          $('.wrapper').html(failHtml);
        }

        function backOrRun() {
          const backOrRunHtml =
          `
            <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
          `
          $('.wrapper').html(backOrRunHtml);
        }

        encounter();
        $(document).on('click', '#catch.btn', fiftyFifty);
        $(document).on('click', '[data-js="reset"].btn', backOrRun);

      }).fail(function(err) {
        console.log(
        `
          ${console.log(err)}
          PokeAPIの取得に失敗しました。
        `
        )
      });
    })
  </script>
</body>
</html>
